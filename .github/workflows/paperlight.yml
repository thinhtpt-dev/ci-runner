# Runs paperlight (private) jobs on free public-repo minutes.
# Triggered by the dispatcher in the private repo (see templates/paperlight-dispatch-ci.yml) or manually.
name: paperlight

on:
  repository_dispatch:
    types: [paperlight]
  workflow_dispatch:
    inputs:
      ref: { description: 'Branch to run', default: main }
      jobs: { description: 'all | comma list of: checks, ios-sideload', default: checks }

concurrency:
  group: paperlight-${{ github.event.client_payload.ref || format('refs/heads/{0}', inputs.ref) }}
  cancel-in-progress: ${{ (github.event.client_payload.ref || format('refs/heads/{0}', inputs.ref)) != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REPO: thinhtpt-dev/paperlight

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      build-sha: ${{ steps.p.outputs.build-sha }}
      checks: ${{ steps.p.outputs.checks }}
      ios: ${{ steps.p.outputs.ios }}
      publish: ${{ steps.p.outputs.publish }}
      ctx: ${{ steps.p.outputs.ctx }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_BUILD_SHA: ${{ github.event.client_payload.build_sha }}
          PAYLOAD_EVENT: ${{ github.event.client_payload.event }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_JOBS: ${{ inputs.jobs }}
          GH_TOKEN: ${{ secrets.CI_RUNNER_PAT }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            ref="refs/heads/$INPUT_REF"; origin=manual; jobs="$INPUT_JOBS"
            sha=$(gh api "repos/$REPO/commits/$INPUT_REF" -q .sha); build_sha="$sha"
            jobs="${jobs// /}"
          else
            ref="$PAYLOAD_REF"; sha="$PAYLOAD_SHA"; build_sha="${PAYLOAD_BUILD_SHA:-$PAYLOAD_SHA}"; origin="$PAYLOAD_EVENT"; jobs=""
          fi
          [[ "$build_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "bad build sha"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha: $sha"; exit 1; }
          main=false; publish=false
          if [ "$ref" = refs/heads/main ] && [ "$origin" != pull_request ]; then
            main=true
            # Publish only commits that really are on main (guards against a mislabelled dispatch).
            st=$(gh api "repos/$REPO/compare/$sha...main" -q .status) || { echo "compare failed"; exit 1; }
            case "$st" in identical|ahead) publish=true ;; esac
          fi
          ctx=""; [ "$origin" = pull_request ] && ctx="pr/"
          # Dispatch events: checks always, iOS IPA on pushes to main (as in the original workflows).
          if [ -z "$jobs" ]; then jobs="checks"; [ "$main" = true ] && jobs="checks,ios-sideload"; fi
          for j in ${jobs//,/ }; do
            case " all checks ios-sideload " in *" $j "*) ;; *) echo "unknown job: $j"; exit 1 ;; esac
          done
          has() { [ "$jobs" = all ] || [[ ",$jobs," == *",$1,"* ]]; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build-sha=$build_sha" >> "$GITHUB_OUTPUT"
          echo "checks=$(has checks && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ios=$(has ios-sideload && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "ctx=$ctx" >> "$GITHUB_OUTPUT"

  checks:
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    uses: ./.github/workflows/node-checks.yml
    secrets: inherit
    with:
      repository: thinhtpt-dev/paperlight
      sha: ${{ needs.plan.outputs.sha }}
      build-sha: ${{ needs.plan.outputs.build-sha }}
      context-prefix: ${{ needs.plan.outputs.ctx }}
      commands: |
        npm run lint
        npm run typecheck
        npm test -- --ci
        npm run test:engine
        npm run build:engine
        git diff --quiet src/engine/generated || { git diff --stat src/engine/generated; echo 'Generated engine is stale'; exit 1; }

  ios-sideload:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    uses: ./.github/workflows/ios-sideload.yml
    secrets: inherit
    with:
      repository: thinhtpt-dev/paperlight
      sha: ${{ needs.plan.outputs.sha }}
      build-sha: ${{ needs.plan.outputs.build-sha }}
      context-prefix: ${{ needs.plan.outputs.ctx }}
      ipa-path: dist/ios/Paperlight-sideload.ipa
      publish: ${{ needs.plan.outputs.publish == 'true' }}

  report:
    needs: [plan, checks, ios-sideload]
    if: always() && needs.plan.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: s
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in
            *" failure "*) echo "state=failure" >> "$GITHUB_OUTPUT" ;;
            *" cancelled "*) echo "state=cancelled" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=success" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: thinhtpt-dev/ci-runner/.github/actions/commit-status@main
        with:
          repository: thinhtpt-dev/paperlight
          sha: ${{ needs.plan.outputs.sha }}
          context: ci-runner/${{ needs.plan.outputs.ctx }}overall
          state: ${{ steps.s.outputs.state }}
          token: ${{ secrets.CI_RUNNER_PAT }}
